# mongod.conf

# for documentation of all options, see:
#   http://docs.mongodb.org/manual/reference/configuration-options/

# Where and how to store data.
storage:
  dbPath: /var/lib/mongodb
#  engine:
#  wiredTiger:

# where to write logging data.
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

# network interfaces
net:
  port: 27017
  bindIp: 0.0.0.0

# how the process runs
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

security:
  keyFile: /etc/mongo/mongo-keyfile  # Путь к ключу ВНУТРИ контейнера
  authorization: enabled             # Включает проверку логинов и паролей

operationProfiling:
#    mode: slowOp  # выключено, то установка лимита по времени все еще учитывается для записи медленных запросов в лог
   slowOpThresholdMs: 15

replication:
  replSetName: "rs0"

setParameter:
  # allow multiple arbiter to allow test write concern
  allowMultipleArbiters: true

  # mongot search parameters
  searchIndexManagementHostAndPort: mongo-search:27028
  mongotHost: mongo-search:27028
  skipAuthenticationToSearchIndexManagementServer: false
  useGrpcForSearch: true

#sharding:

